# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: Build Docker Image

on:
  push:
    branches: [ "master" ]

jobs:
  build_image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: See local directory
        run: ls

      - name: Set VERSION variable from `package.json`
        run: |
          version=`npm pkg get version`
          version="${version//\"/}"
          echo "VERSION=$version" >> $GITHUB_ENV


      # Code from https://medium.com/@shenlu89/building-and-pushing-docker-image-to-docker-hub-using-github-actions-76c90abe95dd
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./docker
          file: ./docker/Dockerfile
          push: true
          tags: |
            waffledog1000/grampacker-test-upload:${{ env.VERSION }}
            waffledog1000/grampacker-test-upload:latest

      - name: Update Docker Hub description
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: waffledog1000/grampacker-test-upload
          short-description: ${{ github.event.repository.description }}
          readme-filepath: ./docker/README.md

